name: Contenido semanal

on:
  schedule:
    - cron: "23 9 * * 1" # lunes 05:23 Caracas
  workflow_dispatch:
    inputs:
      semana:
        description: "Etiqueta de semana (vacío = actual)"
        required: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: Producir y subir a Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_RESEARCH: ${{ vars.GEMINI_MODEL_RESEARCH || 'gemini-3-flash-preview' }}
          POSTS_POR_SEMANA: ${{ vars.POSTS_POR_SEMANA || '4' }}
        run: python -m rcontent ${{ inputs.semana && format('--semana {0}', inputs.semana) || '' }}
      - uses: actions/upload-artifact@v4 # respaldo por si falla Drive
        if: always()
        with:
          name: contenido
          path: out/
          retention-days: 14

[project]
name = "rincon-content"
version = "0.1.0"
description = "Pipeline de producción de contenido para Instagram de Rincón Digital"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.30",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "playwright>=1.45",
  "python-dotenv>=1.0",
]

[project.scripts]
rcontent = "rcontent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rcontent = ["templates/*.html", "templates/*.css", "brief_default.md"]
